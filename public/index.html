<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SR&amp;ED Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { margin-bottom: 0.25rem; }
    .muted { color: #666; }
    button { padding: 0.5rem 1rem; }
    input { padding: 0.4rem; font-size: 1rem; width: 22rem; max-width: 100%; }
    pre  { background: #f5f5f5; padding: 0.75rem; border-radius: 4px; overflow: auto; }
  </style>
</head>
<body>
  <h1>SR&amp;ED Tracker</h1>
  <p class="muted">Scaffold — routes are stubs. See <code>docs/</code>.</p>

  <section id="health">
    <h2>Health</h2>
    <button id="ping">Ping /api/health</button>
    <pre id="health-out"></pre>
  </section>

  <section id="login">
    <h2>Login</h2>
    <p>
      <input id="email" type="email" placeholder="you@example.com">
      <button id="login-btn">Sign in with passkey</button>
    </p>
    <pre id="login-out"></pre>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
